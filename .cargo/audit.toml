# cargo-audit policy
#
# RUSTSEC-2023-0071 applies to rsa 0.9.x. The only path in this workspace is
# the optional sqlx-mysql driver pulled into SQLx's compile-time macro dependency
# graph. Raphael enables only SQLx's SQLite database feature and does not enable
# MySQL, so the vulnerable MySQL authentication code is not part of the
# application feature set. Keep this ignore narrowly scoped and re-evaluate it
# when upgrading SQLx.
[advisories]
ignore = ["RUSTSEC-2023-0071"]
